name: AWS - Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/aws_backend_CI.yaml'

  push:
    branches:
      - main
      - testing
    paths:
      - 'backend/**'
      - '.github/workflows/aws_backend_CI.yaml'

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: multi-cloud-project-ecr-backend

jobs:
  backend-ci:
    name: AWS - Backend CI
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall backend

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          PYTHONPATH: backend
        run: |
          cd backend
          python manage.py check

      - name: Django tests
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          PYTHONPATH: backend
        run: |
          cd backend
          python manage.py test

      - name: Docker build
        run: |
          docker build \
            -t backend:${{ github.sha }} \
            ./backend

      - name: Docker run
        run: |
          docker run -d \
            --name backend-test \
            -p 8000:8000 \
            -e SECRET_KEY=test-secret-key \
            -e DEBUG=True \
            backend:${{ github.sha }}

      - name: Backend health check
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/api/health; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed health check"
          docker logs backend-test
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f backend-test || true

  push-to-ecr:
    name: Push image to ECR
    needs: backend-ci
    environment: dev

    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      
    concurrency:
      group: gitops-image-tag-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-backend-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend
            
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Helm image tag and push with retry
        env:
          IMAGE_TAG: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          FILE="k8s/gitops/workloads/backend/aws-values-dev.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt/5"

            # Refresh the remote branch and start from its latest state.
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

            # Apply this workflow's image tag to the latest version of the file.
            python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/gitops/workloads/backend/aws-values-dev.yaml")
          content = path.read_text()

          content, count = re.subn(
              r'^(\s*tag:\s*).*$',
              lambda match: match.group(1) + os.environ["IMAGE_TAG"],
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError(f"Could not find image tag in {path}")

          path.write_text(content)
          PY

            git add "$FILE"

            if git diff --cached --quiet; then
              echo "Image tag is already up to date."
              exit 0
            fi

            git commit -m "ci: update backend image to ${IMAGE_TAG}"

            # If another workflow pushes first, retry from the new remote HEAD.
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Image tag updated successfully."
              exit 0
            fi

            echo "Push failed; refreshing branch before retry..."
            sleep "$attempt"
          done

          echo "Failed to push image tag after 5 attempts."
          exit 1