name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend_CI.yaml'

  push:
    branches:
      - main
      - testing
    paths:
      - 'backend/**'
      - '.github/workflows/backend_CI.yaml'

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: portfolio-backend

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall backend

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          PYTHONPATH: backend
        run: |
          cd backend
          python manage.py check

      - name: Django tests
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          PYTHONPATH: backend
        run: |
          cd backend
          python manage.py test

      - name: Docker build
        run: |
          docker build \
            -t backend:${{ github.sha }} \
            ./backend

      - name: Docker run
        run: |
          docker run -d \
            --name backend-test \
            -p 8000:8000 \
            -e SECRET_KEY=test-secret-key \
            -e DEBUG=True \
            backend:${{ github.sha }}

      - name: Backend health check
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/api/health; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed health check"
          docker logs backend-test
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f backend-test || true

  push-to-ecr:
    name: Push image to ECR
    needs: backend-ci

    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-backend-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            ./backend

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
 