name: Frontend CI - Azure

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_CI_Azure.yaml'

  push:
    branches:
      - main
      - testing
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_CI_Azure.yaml'

permissions:
  contents: read

env:
  AZURE_REGISTRY: acrmulticloudproject.azurecr.io
  ACR_REPOSITORY: frontend

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -s frontend/index.html
          test -s frontend/default.png

      - name: Docker build
        run: |
          docker build \
            -t frontend:${{ github.sha }} \
            ./frontend

      - name: Run container
        run: |
          docker run -d \
            --name frontend-test \
            -p 8080:80 \
            frontend:${{ github.sha }}

      - name: Test frontend
        run: |
          sleep 3
          curl --fail http://localhost:8080/

      - name: Cleanup
        if: always()
        run: |
          docker rm -f frontend-test || true

  push-to-acr:
    name: Push frontend image to Azure Container Registry
    needs: frontend-ci

    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name acrMultiCloudProject

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $AZURE_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG \
            ./frontend

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.AZURE_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $AZURE_REGISTRY/$ACR_REPOSITORY:$IMAGE_TAG

      - name: Update Helm image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/gitops/workloads/frontend/values-dev-Azure.yaml")

          content = path.read_text()

          content, count = re.subn(
              r'(^\s*tag:\s*).*$',
              rf'\g<1>{os.environ["IMAGE_TAG"]}',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise RuntimeError("Could not find image.tag in values.yaml")

          path.write_text(content)
          PY

      - name: Commit updated image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/gitops/workloads/frontend/values-dev-Azure.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "ci: update Azure frontend image to ${{ github.sha }}"
          git push