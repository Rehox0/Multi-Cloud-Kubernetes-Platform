apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infra-project

  source:
    repoURL: https://github.com/Rehox0/allegro-analytics-eks.git
    targetRevision: main
    path: k8s/gitops/infra/esss

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true