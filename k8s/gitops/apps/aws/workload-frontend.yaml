apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-frontend-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: infra-project

  source:
    repoURL: https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git
    targetRevision: testing
    path: k8s/gitops/workloads/frontend
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true