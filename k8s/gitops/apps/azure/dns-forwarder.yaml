apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-forwarder
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: azure-infra-project
  sources:
    - repoURL: https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git
      targetRevision: testing
      path: k8s/gitops/infra/azure/dns_forwarder
      helm:
        valueFiles:
        - $values/k8s/gitops/infra/azure/values.yaml

    - repoURL: https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git
      targetRevision: testing
      ref: values


  destination:
    server: https://kubernetes.default.svc
    namespace: dns-forwarder

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true