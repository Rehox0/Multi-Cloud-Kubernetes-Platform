apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-backend-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: azure-infra-project

  sources:
    - repoURL: https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git
      targetRevision: testing
      path: k8s/gitops/infra/azure/eso
      helm:
        valueFiles:
          - $values/k8s/gitops/infra/azure/values.yaml

    - repoURL: https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git
      targetRevision: testing
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true