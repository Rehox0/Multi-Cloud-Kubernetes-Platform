apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: infra-project
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.9.1
    helm:
      values: |
        serviceAccount:
          create: false
          name: karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true