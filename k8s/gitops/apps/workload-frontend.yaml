apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: infra-project
  source:
    repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
    targetRevision: testing
    path: k8s/gitops/workloads/frontend
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: frontend-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true