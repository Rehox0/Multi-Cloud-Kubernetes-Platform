configs:
  cm:
    resource.customizations.health.external-secrets.io_ClusterSecretStore: |
      hs = {}

      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "ClusterSecretStore is Ready"
              return hs
            end

            if condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "ClusterSecretStore is not Ready"
              return hs
            end
          end
        end
      end

      hs.status = "Progressing"
      hs.message = "Waiting for ClusterSecretStore to become Ready"

      return hs

