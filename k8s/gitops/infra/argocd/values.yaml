configs:
  cm:
    resource.customizations.health.argoproj.io_Application: |
      hs = {}

      if obj.metadata.name ~= "eso-operator" then
        hs.status = "Progressing"
        hs.message = "Waiting for Application health"
        return hs
      end

      local required = {
        ["eso-operator-external-secrets"] = true,
        ["eso-operator-external-secrets-cert-controller"] = true,
        ["eso-operator-external-secrets-webhook"] = true
      }

      local healthy = 0
      local found = 0

      if obj.status ~= nil and obj.status.resources ~= nil then
        for _, resource in ipairs(obj.status.resources) do
          if resource.kind == "Deployment"
             and resource.namespace == "external-secrets"
             and required[resource.name] then

            found = found + 1

            if resource.health ~= nil
               and resource.health.status == "Healthy" then
              healthy = healthy + 1
            end
          end
        end
      end

      if found == 3 and healthy == 3 then
        hs.status = "Healthy"
        hs.message = "All 3 ESO deployments are Healthy"
        return hs
      end

      hs.status = "Progressing"
      hs.message = string.format(
        "Waiting for ESO deployments: %d/3 Healthy",
        healthy
      )

      return hs