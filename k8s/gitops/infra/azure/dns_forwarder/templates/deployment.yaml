apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-forwarder
  namespace: dns-forwarder
  labels:
    app: dns-forwarder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-forwarder
  template:
    metadata:
      labels:
        app: dns-forwarder
    spec:
      containers:
        - name: coredns
          image: coredns/coredns:1.12.4
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dns-forwarder
