apiVersion: v1
kind: Service
metadata:
  name: dns-forwarder
  namespace: dns-forwarder
  labels:
    app: dns-forwarder
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "Multi-Cloud-Project-aks-subnet-2"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.20.8.10"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.20.8.10
  selector:
    app: dns-forwarder
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP