apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: eso-azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.spec.provider.azurekv.vaultUrl | quote }}
      tenantId: "b7233ea5-330b-4215-a536-3ebe0e72e5cb"
      serviceAccountRef:
        name: backend
        namespace: backend-ns