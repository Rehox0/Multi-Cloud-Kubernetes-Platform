apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-nodeport-config
  namespace: gateway-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-nodeport-config
  namespace: gateway-ns
rules:
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-nodeport-config
  namespace: gateway-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-nodeport-config
subjects:
  - kind: ServiceAccount
    name: gateway-nodeport-config
    namespace: gateway-ns
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-nodeport-config
  namespace: gateway-ns
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5

  template:
    spec:
      serviceAccountName: gateway-nodeport-config
      restartPolicy: OnFailure

      containers:
        - name: configure-nodeport
          image: registry.k8s.io/kubectl:v1.35.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NAMESPACE="gateway-ns"
              SERVICE="cilium-gateway-main-gateway"
              SERVICE_PORT="80"
              NODE_PORT="32767"

              echo "Waiting for ${SERVICE}..."

              until kubectl get service "${SERVICE}" \
                -n "${NAMESPACE}" >/dev/null 2>&1; do
                echo "Service not ready yet..."
                sleep 2
              done

              echo "Service found."

              PORT_INDEX=""

              while true; do
                PORT_COUNT="$(kubectl get service "${SERVICE}" \
                  -n "${NAMESPACE}" \
                  -o jsonpath='{.spec.ports[*].port}' \
                  | wc -w)"

                INDEX=0

                for PORT in $(kubectl get service "${SERVICE}" \
                  -n "${NAMESPACE}" \
                  -o jsonpath='{.spec.ports[*].port}'); do

                  if [ "${PORT}" = "${SERVICE_PORT}" ]; then
                    PORT_INDEX="${INDEX}"
                    break
                  fi

                  INDEX=$((INDEX + 1))
                done

                if [ -n "${PORT_INDEX}" ]; then
                  break
                fi

                echo "Port ${SERVICE_PORT} not ready yet..."
                sleep 2
              done

              echo "Found service port ${SERVICE_PORT} at index ${PORT_INDEX}."

              CURRENT_NODE_PORT="$(kubectl get service "${SERVICE}" \
                -n "${NAMESPACE}" \
                -o jsonpath="{.spec.ports[${PORT_INDEX}].nodePort}")"

              echo "Current NodePort: ${CURRENT_NODE_PORT}"
              echo "Desired NodePort: ${NODE_PORT}"

              if [ "${CURRENT_NODE_PORT}" = "${NODE_PORT}" ]; then
                echo "NodePort already configured."
                exit 0
              fi

              kubectl patch service "${SERVICE}" \
                -n "${NAMESPACE}" \
                --type=json \
                -p="[{\"op\":\"replace\",\"path\":\"/spec/ports/${PORT_INDEX}/nodePort\",\"value\":${NODE_PORT}}]"

              echo "NodePort configured successfully."

              kubectl get service "${SERVICE}" \
                -n "${NAMESPACE}" \
                -o wide