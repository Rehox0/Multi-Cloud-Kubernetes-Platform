deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: azure
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

    azure:
      accountName: ""
      accountKey: ""
      useManagedIdentity: false
      useFederatedToken: true

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: azure

  ingester:
    chunk_encoding: snappy

  pattern_ingester:
    enabled: true

  ruler:
    enable_api: true

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 20Gi
    storageClass: managed-csi

# Disable all other deployment modes
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

gateway:
  enabled: true
  replicas: 1

monitoring:
  serviceMonitor:
    enabled: true

test:
  enabled: false

minio:
  enabled: false