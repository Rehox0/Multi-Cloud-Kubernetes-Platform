deploymentMode: SingleBinary

loki:
  storage:
    type: azure

    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

    azure:
      accountName: ""
      accountKey: ""
      useManagedIdentity: false
      useFederatedToken: true

singleBinary:
  replicas: 1
  podLabels:
    app: loki

  persistence:
    enabled: true
    size: 20Gi
    storageClass: managed-csi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0