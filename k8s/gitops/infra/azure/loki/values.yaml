deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: azure

    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin

    azure:
      accountName: ""
      accountKey: ""
      useManagedIdentity: false
      useFederatedToken: true

singleBinary:
  replicas: 1
  podLabels:
    app: loki

  persistence:
    enabled: true
    size: 20Gi
    storageClass: managed-csi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

write:
  replicas: 0

read:
  replicas: 0

backend:
  replicas: 0

lokiCanary:
  enabled: false

gateway:
  enabled: false

chunksCache:
  enabled: false
  replicas: 0

resultsCache:
  enabled: false
  replicas: 0

minio:
  enabled: false

test:
  enabled: false