apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: test-alert
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: portfolio-test
      rules:
        - alert: PortfolioTestAlert
          expr: vector(1)
          for: 1m
          labels:
            severity: warning
            namespace: monitoring
          annotations:
            summary: "Portfolio alerting test"
            description: "This is a temporary test alert for the full alerting workflow."