apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-backend-secret
  namespace: backend-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: eso-aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: eso-backend-secret-dev
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      key: infra-project
      property: SECRET_KEY
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None