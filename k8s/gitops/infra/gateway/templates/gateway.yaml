apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.service.ports.http }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.allowedRoutes.from }}

    {{- if .Values.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.service.ports.https }}
      allowedRoutes:
        namespaces:
          from: {{ .Values.allowedRoutes.from }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.tls.secretName }}
    {{- end }}