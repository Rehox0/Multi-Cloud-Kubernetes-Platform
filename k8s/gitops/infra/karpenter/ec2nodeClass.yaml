apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  role: allegro-analytics-eks-dev-karpenter-node-role

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: allegro-analytics-eks-dev-eks-cluster

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: allegro-analytics-eks-dev-eks-cluster

  tags:
    Name: allegro-analytics-eks-dev-karpenter
    karpenter.sh/discovery: allegro-analytics-eks-dev-eks-cluster