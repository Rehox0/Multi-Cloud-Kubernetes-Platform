apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aws-infra-project
  namespace: argocd
spec:
  description: "Application project for ArgoCD"
  sourceRepos:
    - 'https://kyverno.github.io/kyverno/'
    - 'https://charts.external-secrets.io'
    - 'https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git'
    - 'public.ecr.aws/karpenter'
    - 'https://prometheus-community.github.io/helm-charts'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-root-app
  namespace: argocd
spec:
  project: aws-infra-project

  source:
    repoURL: https://github.com/Rehox0/Multi-Cloud-Kubernetes-Platform.git
    targetRevision: testing
    path: k8s/gitops/apps/aws

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prio-high
value: 100000
globalDefault: false
description: "High priority workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prio-medium
value: 10000
globalDefault: false
description: "Medium priority workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prio-low
value: 1000
globalDefault: false
description: "Low priority workloads"