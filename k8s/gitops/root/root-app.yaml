apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra-project
  namespace: argocd
spec:
  description: "Application project for ArgoCD"
  sourceRepos:
    - 'https://kyverno.github.io/kyverno/'
    - 'https://charts.external-secrets.io'
    - 'https://github.com/Rehox0/allegro-analytics-eks.git'
    - 'public.ecr.aws/karpenter'
    - 'https://prometheus-community.github.io/helm-charts'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: infra-project

  source:
    repoURL: https://github.com/Rehox0/allegro-analytics-eks.git
    targetRevision: testing
    path: k8s/gitops/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prio-critical
value: 1000000
globalDefault: false
description: "Critical platform workloads"

---

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prio-high
value: 100000
globalDefault: false
description: "Critical application workloads"

---

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prio-low
value: 1000
globalDefault: false
description: "Low priority workloads"