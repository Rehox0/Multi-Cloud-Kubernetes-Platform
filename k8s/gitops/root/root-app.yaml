apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: root-app
  namespace: argocd
spec:
  description: "Application project for ArgoCD"
  sourceRepos:
    - 'https://kyverno.github.io/kyverno/'
    - 'https://charts.external-secrets.io'
    - 'https://github.com/Rehox0/allegro-analytics-eks.git'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: infra-project

  source:
    repoURL: https://github.com/Rehox0/allegro-analytics-eks.git
    targetRevision: testing
    path: k8s/gitops/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true