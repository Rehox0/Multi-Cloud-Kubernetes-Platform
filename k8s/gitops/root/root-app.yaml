apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: root-app
  namespace: argocd
spec:
  description: "Application project for ArgoCD"
  sourceRepos:
    - 'https://kyverno.github.io/kyverno/'
    - 'https://charts.external-secrets.io'
    - 'https://github.com/Rehox0/allegro-analytics-eks.git'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: infra-project

  source:
    repoURL: https://github.com/Rehox0/allegro-analytics-eks.git
    targetRevision: testing
    path: k8s/gitops/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-set
  namespace: argocd

spec:
  template:
    metadata:
      name: 'default'
    spec:
      project: infra-project
      source:
        repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
        targetRevision: testing
        path: '.'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
  generators:

    # ============================================================
    # GENERATOR 1 
    # ============================================================
    - list:
        elements:
          - name: eso-operator
            syncGroup: "1"
            namespace: external-secrets
            repoURL: https://charts.external-secrets.io
            chart: external-secrets
            targetRevision: "2.8.0"

        template:
          metadata:
            name: '{{name}}'
            labels:
              infra.project.dev/sync-group: '{{syncGroup}}'

          spec:
            project: infra-project

            source:
              repoURL: '{{repoURL}}'
              chart: '{{chart}}'
              targetRevision: '{{targetRevision}}'
              helm:
                values: |
                  installCRDs: true

            destination:
              server: https://kubernetes.default.svc
              namespace: '{{namespace}}'

            syncPolicy:
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
    - list:
        elements:
          - name: eso-backend-secret
            path: k8s/gitops/infra/eso/backend_secret
            syncGroup: "2"
            namespace: external-secrets
        template:
          metadata:
            name: '{{name}}'
            labels:
              infra.project.dev/sync-group: '{{syncGroup}}'
          spec:
            project: infra-project
            source:
              repoURL: https://github.com/Rehox0/allegro-analytics-eks.git
              targetRevision: testing
              path: '{{path}}'
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{namespace}}'
            syncPolicy:
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true

  # ================================================================
  # RollingSync
  # ================================================================

  strategy:
    type: RollingSync
    rollingSync:
      steps:
      # GROUP 1
      - matchExpressions:
          - key: infra.project.dev/sync-group
            operator: In
            values: ["1"]
      # GROUP 2
      - matchExpressions:
          - key: infra.project.dev/sync-group
            operator: In
            values: ["2"]