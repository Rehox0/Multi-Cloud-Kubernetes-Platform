apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra-project
  namespace: argocd
spec:
  description: "Application project for ArgoCD"
  sourceRepos:
    - 'https://kyverno.github.io/kyverno/'
    - 'https://charts.external-secrets.io'
    - 'https://github.com/Rehox0/allegro-analytics-eks.git'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

---

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-addons
  namespace: argocd

spec:
  generators:
    - list:
        elements:

          # ============================================================
          # GROUP 1
          # ESO operator
          # ============================================================

          - name: eso-operator
            repoURL: 'https://charts.external-secrets.io'
            chart: external-secrets
            targetRevision: 2.8.0
            sync-group: "1"
            namespace: external-secrets

          # ============================================================
          # GROUP 2
          # ClusterSecretStore-backend-dev
          # ============================================================

          - name: eso-secret-storage
            repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
            targetRevision: testing
            path: k8s/gitops/infra/eso/cluster_secret_store
            sync-group: "2"
            namespace: external-secrets

          # ============================================================
          # GROUP 3
          # Workloads / remaining infrastructure
          # ============================================================

          - name: workload-backend-dev
            repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
            targetRevision: testing
            path: k8s/gitops/workloads/backend/app
            sync-group: "3"
            namespace: backend-ns

          - name: gateway
            repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
            targetRevision: testing
            path: k8s/gitops/infra/gateway/app
            sync-group: "3"
            namespace: gateway-ns

          - name: kyverno-system
            repoURL: 'https://kyverno.github.io/kyverno/'
            chart: kyverno
            targetRevision: 3.8.2
            path: k8s/gitops/infra/kyverno/system
            sync-group: "3"
            namespace: kyverno

          - name: kyverno-policies
            repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
            targetRevision: testing
            path: k8s/gitops/infra/kyverno/policy/app
            sync-group: "3"
            namespace: kyverno

          # ============================================================
          # GROUP 4
          # Workloads / testing
          # ============================================================

          - name: workload-frontend-dev
            repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
            targetRevision: testing
            path: k8s/gitops/workloads/frontend/app
            sync-group: "4"
            namespace: frontend-ns
  # ================================================================
  # RollingSync
  # ================================================================

  strategy:
    type: RollingSync
    rollingSync:
      steps:
      # GROUP 1
      - matchExpressions:
          - key: infra.project.dev/sync-group
            operator: In
            values: ["1"]
      # GROUP 2
      - matchExpressions:
          - key: infra.project.dev/sync-group
            operator: In
            values: ["2"]
      # GROUP 3
      - matchExpressions:
          - key: infra.project.dev/sync-group
            operator: In
            values: ["3"]
      # GROUP 4
      - matchExpressions:
          - key: infra.project.dev/sync-group
            operator: In
            values: ["4"]

  # ================================================================
  # Application template
  # ================================================================

  template:
    metadata:
      name: '{{name}}'
      labels:
        infra.project.dev/sync-group: '{{sync-group}}'
    spec:
      project: infra-project
      source:
        repoURL: '{{repoURL}}'
        targetRevision: '{{targetRevision}}'
        path: '{{path}}'
        chart: '{{chart}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true