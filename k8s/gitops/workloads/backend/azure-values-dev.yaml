replicaCount: 4

image:
  repository: multicloudprojectacr1.azurecr.io/backend
  tag: 1afd56d5a4e246d68cb5605405b0983524e395f9

serviceAccount:
  create: false
  name: backend

env:
  debug: "True"
  allowedHosts: "*"
  cloudProvider: "Azure"
  cloudRegion: "germanywestcentral"
  backendPlatform: "AKS"

service:
  type: ClusterIP
  port: 8000
  
  containerPort: 8000
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  - protocol: UDP
    port: 9999
    targetPort: 9999

gateway:
  enabled: true
  name: main-gateway
  namespace: gateway-ns
  host: "my-domain.com"

externalSecret:
  refreshInterval: "1m"
  remoteKey: "Multi-Cloud-ProjectKV1"
  targetName: "eso-backend-secret"
  secretStoreRef:
    name: "azure-keyvault"
    kind: "ClusterSecretStore"

networkPolicy:
  enabled: true
  frontendAppLabel: azure-workload-frontend-dev
  remoteGatewayCIDR: 10.0.10.116/32

backend:
  host: http://workload-backend-dev.backend-ns.svc.cluster.local
  port: 8000