apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: backend-ns
spec:
  endpointSelector:
    matchLabels:
      app: workload-backend-dev
  ingress:
    # Frontend
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: frontend-ns
            app: workload-frontend-dev
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9999"
              protocol: UDP
    # Cilium Gateway / Envoy
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP