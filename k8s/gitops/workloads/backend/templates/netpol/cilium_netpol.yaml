apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-policy
  namespace: backend-ns
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Release.Name | quote }}

  ingress:
    # Frontend
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: frontend-ns
            app: {{ .Values.networkPolicy.frontendAppLabel | quote }}
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9999"
              protocol: UDP

    # Cilium Gateway / Envoy
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Prometheus
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP

  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP