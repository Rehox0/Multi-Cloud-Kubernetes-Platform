apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret-sync
  namespace: backend-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: backend-secret
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      key: infra-project
      property: SECRET_KEY