apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-frontend-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: infra-project
  source:
    repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
    targetRevision: testing
    path: k8s/gitops/workloads/frontend
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: frontend-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true