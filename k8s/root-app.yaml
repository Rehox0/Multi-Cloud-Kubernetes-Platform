apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-addons
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Rehox0/allegro-analytics-eks.git'
    targetRevision: testing
    path: k8s/gitops
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true